<!DOCTYPE html>
<html>
<head>
  <title>Pricing - TradeGuard Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { 
      font-family: 'Inter', -apple-system, blinkmacsystemfont, 'Segoe UI', roboto, sans-serif; 
      padding: 0; 
      margin: 0;
      background-color: #000; 
      color: white; 
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      max-width: 400px;
      width: 90%;
      text-align: center;
      padding: 40px;
      border: 1px solid #333;
      border-radius: 24px;
      background: linear-gradient(145deg, #111, #000);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .brand {
      color: #00FF00;
      font-weight: 900;
      letter-spacing: 2px;
      font-size: 14px;
      margin-bottom: 24px;
      display: block;
    }
    h1 { 
      font-size: 28px;
      margin: 10px 0;
    }
    .price {
      font-size: 48px;
      font-weight: 900;
      margin: 20px 0;
      color: #fff;
    }
    .period {
      font-size: 16px;
      color: #888;
      font-weight: normal;
    }
    .features {
      text-align: left;
      margin: 30px 0;
      padding: 0;
      list-style: none;
    }
    .features li {
      margin-bottom: 12px;
      color: #ccc;
      display: flex;
      align-items: center;
    }
    .features li:before {
      content: '✓';
      color: #00FF00;
      margin-right: 12px;
      font-weight: bold;
    }
    .footer-note {
      font-size: 12px;
      color: #555;
      margin-top: 30px;
      line-height: 1.5;
    }
    a { color: #00FF00; text-decoration: none; }
    .back-link {
        display: inline-block;
        margin-top: 20px;
        font-size: 14px;
        color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="brand">TRADEGUARD PRO</span>
    <h1>Monthly Subscription</h1>
    <div class="price">$4.99 <span class="period">/ month</span></div>
    
    <ul class="features">
      <li>Auto-Sync across all devices</li>
      <li>Multi-Account Management</li>
      <li>PDT Strike Counter & Alerts</li>
      <li>Encrypted Cloud Backup</li>
    </ul>

    <div class="footer-note">
      Billed monthly. Cancel anytime.<br>
      Refunds available within 14 days as per our <a href="refund.html">Refund Policy</a>.
    </div>

    <a href="index.html" class="back-link">← Return to Home</a>
  </div>
</body>
</html>
